name: Final integrated Portable Windows QA
run-name: ACCOUNT 02 public configuration readiness / ${{ github.run_id }}
on:
  push:
    branches: [qa/final-integrated-windows]
    paths: ['.github/workflows/electron-p0-windows.yml', 'scripts/qa/td2-soft-rose-portable.mjs', 'scripts/qa/td2-window.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: td2-soft-rose-portable-gui
  cancel-in-progress: false
jobs:
  portable-gui:
    if: github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/qa/final-integrated-windows' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout immutable ACCOUNT product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8f9a1f0aa88502b1c45b2d575abdab5300234bbb
          persist-credentials: false
      - name: Read public configuration metadata only
        env:
          ACCOUNT_URL_PRESENT: ${{ vars.VITE_SUPABASE_URL != '' }}
          ACCOUNT_URL_MATCHES: ${{ vars.VITE_SUPABASE_URL == 'https://xxownwxxajzrviuvvfiu.supabase.co' }}
          ACCOUNT_PUBLISHABLE_PRESENT: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
          ACCOUNT_MODERN_PUBLIC_PREFIX: ${{ startsWith(vars.VITE_SUPABASE_PUBLISHABLE_KEY, 'sb_publishable_') }}
          ACCOUNT_LEGACY_ALIAS_PRESENT: ${{ vars.VITE_SUPABASE_ANON_KEY != '' }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne '8f9a1f0aa88502b1c45b2d575abdab5300234bbb'){throw 'Source mismatch'}
          if(git status --porcelain){throw 'Dirty product checkout'}
          $root=Join-Path $env:RUNNER_TEMP "account02-config-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory $root | Out-Null
          [ordered]@{
            sourceSha=(git rev-parse HEAD).Trim();runId=$env:GITHUB_RUN_ID
            urlPresent=$env:ACCOUNT_URL_PRESENT -eq 'true'
            urlMatchesExistingProject=$env:ACCOUNT_URL_MATCHES -eq 'true'
            publishableVariablePresent=$env:ACCOUNT_PUBLISHABLE_PRESENT -eq 'true'
            modernPublicPrefix=$env:ACCOUNT_MODERN_PUBLIC_PREFIX -eq 'true'
            legacyAnonAliasPresent=$env:ACCOUNT_LEGACY_ALIAS_PRESENT -eq 'true'
            keyValueRead=$false;keyCryptographicallyValidated=$false
            environmentScope='repository and organization vars available to existing QA job; no production Environment attached'
            productionAuthSettings='NOT VERIFIED';realLogin='NOT RUN'
            productChanged=$false;buildRepeated=$false;externalAuthRequests=0
          } | ConvertTo-Json | Set-Content "$root/public-config-readiness.json"
          Get-Content "$root/public-config-readiness.json" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload configuration metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: account02-public-config-${{ github.run_id }}
          path: ${{ runner.temp }}/account02-config-${{ github.run_id }}/public-config-readiness.json
          if-no-files-found: error
          retention-days: 14
