name: Final integrated Portable Windows QA
run-name: Final integrated Portable / f3b303e / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: td2-soft-rose-portable-gui
  cancel-in-progress: false

jobs:
  portable-gui:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/qa/final-integrated-windows' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TD2_CONTROLLER_BASE_SHA: b085e8b7c7a5ec1bd6c7ba54cc689fcf11dbc2cc
      TD2_PRODUCT_SHA: f3b303ef83149c5b946978d98ce205a3621d125a
    steps:
      - name: Checkout immutable approved product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3b303ef83149c5b946978d98ce205a3621d125a
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout QA controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify immutable source and QA-only controller
        run: |
          $ErrorActionPreference='Stop'
          $source=(git -C source rev-parse HEAD).Trim()
          if($source -cne $env:TD2_PRODUCT_SHA){throw 'Approved product SHA mismatch'}
          if(git -C source status --porcelain){throw 'Approved product checkout is dirty'}
          $allowed=@('.github/workflows/electron-p0-windows.yml','scripts/qa/td2-soft-rose-portable.mjs','scripts/qa/td2-window.ps1')
          $changed=@(git -C controller diff --name-only $env:TD2_CONTROLLER_BASE_SHA HEAD)
          foreach($path in $changed){if($path -notin $allowed){throw "Non-QA controller change: $path"}}
          if($changed.Count -ne 3){throw 'Expected exactly three QA controller files'}
          $root=Join-Path $env:RUNNER_TEMP "td2-portable-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory "$root/evidence","$root/temp","$root/npm-cache","$root/f-drive" | Out-Null
          New-Item -ItemType Directory "$root/profile","$root/appdata","$root/localappdata" | Out-Null
          "TD2_ROOT=$root" >> $env:GITHUB_ENV
          "TD2_EVIDENCE_ROOT=$root/evidence" >> $env:GITHUB_ENV
          "TD2_PRODUCT_ROOT=${{ github.workspace }}/source" >> $env:GITHUB_ENV
          "TEMP=$root/temp" >> $env:GITHUB_ENV
          "TMP=$root/temp" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm-cache" >> $env:GITHUB_ENV
          "ELECTRON_P0_QA_ROOT=$root/profile" >> $env:GITHUB_ENV
          [ordered]@{
            productSha=$source;controllerSha=(git -C controller rev-parse HEAD).Trim();workflowSha='${{ github.workflow_sha }}'
            runner='windows-2022';runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT
          }|ConvertTo-Json|Set-Content "$root/evidence/provenance.json"
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Focused profile and design contracts
        working-directory: source
        run: npx vitest run electron-p0/tests/qa-profile.test.ts
      - name: Download previously verified native payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: final-integrated-portable-f3b303e-41789550793
          run-id: 41789550793
          github-token: ${{ github.token }}
          path: prior-portable
      - name: Reuse exact native binaries without rebuilding unchanged source
        run: |
          $ErrorActionPreference='Stop'
          git -C source diff --exit-code b9a0a1b3893c2f45eeeed7278b86442e415dc159 HEAD -- tools src-tauri
          if($LASTEXITCODE -ne 0){throw 'Native source changed; reuse forbidden'}
          $old=@(Get-ChildItem prior-portable/*.exe)
          if($old.Count -ne 1){throw 'Prior Portable missing'}
          7z x $old[0].FullName "-o$env:TD2_ROOT/prior-container" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Prior Portable extraction failed'}
          $archive=@(Get-ChildItem "$env:TD2_ROOT/prior-container" -Recurse -Filter app-64.7z)
          if($archive.Count -ne 1){throw 'Expected one embedded app archive'}
          7z x $archive[0].FullName "-o$env:TD2_ROOT/prior-app" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Prior payload extraction failed'}
          $hashes=@{
            'purchase-excel-cli'='5240026d893e6529361907915fd05ebf5498526e0bbf723a360c38fc5532175e';
            'official-document-cli'='61697e919f96bf3816f1bcf7066684c8d64d7b3a3435c188ba92fc347b23c8e0';
            'my-finance-cli'='b40175de3b7f65496674c7ebd2200d680b48f124a3933d812d5f7c09cc0992d9';
            'chatgpt-auth-cli'='5f36d7340eaf184ac88866149cc46f1765fe279044e23d8aecec4e993fc22669'
          }
          foreach($cli in $hashes.Keys){
            $root="$env:TD2_ROOT/prior-app/resources/$cli"
            if((Get-FileHash "$root/$cli.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hashes[$cli]){throw "Reused CLI hash mismatch: $cli"}
            New-Item -ItemType Directory "source/build/$cli" -Force | Out-Null
            Copy-Item "$root/*" "source/build/$cli/" -Recurse
          }
          [ordered]@{originRun=41789550793;nativeSourceSha='b9a0a1b3893c2f45eeeed7278b86442e415dc159';productSha=$env:TD2_PRODUCT_SHA;nativeSourceUnchanged=$true;hashes=$hashes;dpapiAndLoopback='REUSED from original Windows run'} | ConvertTo-Json -Depth 4 | Set-Content "$env:TD2_EVIDENCE_ROOT/native-reuse.json"
      - name: Build changed app and Portable once
        working-directory: source
        run: |
          npm run electron:p0:build
          if($LASTEXITCODE -ne 0){throw 'Electron build failed'}
          New-Item -ItemType Directory release-electron-p0/win-unpacked -Force | Out-Null
          Copy-Item "$env:TD2_ROOT/prior-app/*" release-electron-p0/win-unpacked/ -Recurse
          Copy-Item ../prior-portable/*.exe release-electron-p0/
          node -e "const a=require('@electron/asar');const m=JSON.parse(a.extractFile('release-electron-p0/win-unpacked/resources/app.asar','build-meta.json'));if(m.sourceSha!==process.env.TD2_PRODUCT_SHA||m.dirty)throw Error('Reused product SHA mismatch');"
          if($LASTEXITCODE -ne 0){throw 'Reused Portable source gate failed'}
      - name: Record Portable and actual Windows DPI
        run: |
          $ErrorActionPreference='Stop'
          $portable=@(Get-ChildItem source/release-electron-p0/*.exe -File)
          if($portable.Count -ne 1){throw 'Expected exactly one Portable EXE'}
          $hash=(Get-FileHash $portable[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($portable[0].Name)"|Set-Content "$env:TD2_EVIDENCE_ROOT/PORTABLE-SHA256.txt"
          "TD2_PORTABLE_EXE=$($portable[0].FullName)" >> $env:GITHUB_ENV
          "TD2_EXPECTED_SOURCE_SHA=$env:TD2_PRODUCT_SHA" >> $env:GITHUB_ENV
          $desktop=Get-ItemProperty 'HKCU:\Control Panel\Desktop'
          $metrics=Get-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics'
          $dpi=[ordered]@{
            appliedDpi=$metrics.AppliedDPI;logPixels=$desktop.LogPixels;win8DpiScaling=$desktop.Win8DpiScaling
            dpi100=if($metrics.AppliedDPI -eq 96){'VERIFIED'}else{'NOT VERIFIED'}
            dpi125='NOT VERIFIED';dpi150='NOT VERIFIED';emulationUsed=$false
          }
          $dpi|ConvertTo-Json|Set-Content "$env:TD2_EVIDENCE_ROOT/windows-dpi.json"
          [ordered]@{sourceSha=$env:TD2_PRODUCT_SHA;file=$portable[0].Name;bytes=$portable[0].Length;sha256=$hash;signature=[string](Get-AuthenticodeSignature $portable[0].FullName).Status}|ConvertTo-Json|Set-Content "$env:TD2_EVIDENCE_ROOT/portable.json"
      - name: Verify packaged runtime, resources and source
        working-directory: source
        run: |
          node --test scripts/electron-p0/runtime-package.test.mjs scripts/electron-p0/chatgpt-package.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Packaged contract tests failed'}
          node scripts/electron-p0/check-ocr-package.mjs
          if($LASTEXITCODE -ne 0){throw 'Staged OCR integrity failed'}
          $diag=@'
          const {spawnSync}=require('node:child_process'),{resolve,join}=require('node:path'),fs=require('node:fs');
          const runtime=resolve('release-electron-p0/win-unpacked/resources/purchase-ocr');
          const bootstrap=join(process.env.TD2_ROOT,'ocr-diagnostic.cjs');
          fs.writeFileSync(bootstrap,`console.error('NODE',process.versions.node,'ELECTRON',process.versions.electron);const Module=require('module'),load=Module._load;Module._load=function(name,...rest){const m=load.call(this,name,...rest);if(name==='./node_modules/tesseract.js')return {...m,createWorker:(l,o,c)=>m.createWorker(l,o,{...c,logger:p=>console.error('STAGE',p.status),errorHandler:e=>console.error('WORKER_ERROR',String(e).slice(0,1500))})};return m;};require(${JSON.stringify(join(runtime,'runner.cjs'))});`);
          const r=spawnSync(resolve('release-electron-p0/win-unpacked/BOGUNON DESK ELECTRON P0.exe'),['--max-old-space-size=256','--require',join(runtime,'offline-guard.cjs'),bootstrap,resolve('electron-p0/tests/fixtures/purchase-image/synthetic-cart.png')],{env:{SystemRoot:process.env.SystemRoot,WINDIR:process.env.WINDIR,TEMP:process.env.TEMP,TMP:process.env.TMP,ELECTRON_RUN_AS_NODE:'1'},encoding:'utf8',timeout:20000,maxBuffer:1048576});
          const summary={status:r.status,error:r.error?.code,stderr:(r.stderr??'').slice(0,4000),stdoutBytes:Buffer.byteLength(r.stdout??'')};fs.writeFileSync(join(process.env.TD2_EVIDENCE_ROOT,'ocr-diagnostic.json'),JSON.stringify(summary,null,2));console.log(JSON.stringify(summary));if(r.status!==0)process.exitCode=1;
          '@
          $diag | Set-Content "$env:TD2_ROOT/ocr-diagnostic-parent.cjs"
          node "$env:TD2_ROOT/ocr-diagnostic-parent.cjs"
          if($LASTEXITCODE -ne 0){throw 'Packaged OCR diagnostic failed; inspect synthetic bounded evidence'}
          node --input-type=module -e "import {recognizeImage,verifyOcrRuntime} from './build/electron-p0-app/main/purchase-image-ocr.js';import {resolve} from 'node:path';import {writeFileSync} from 'node:fs';const root=resolve('release-electron-p0/win-unpacked/resources/purchase-ocr');await verifyOcrRuntime(root);const lines=await recognizeImage(root,resolve('electron-p0/tests/fixtures/purchase-image/synthetic-cart.png'),new AbortController().signal,90000,resolve('release-electron-p0/win-unpacked/BOGUNON DESK ELECTRON P0.exe'));if(!lines.some(l=>l.text.includes('24,000')))throw Error('Packaged OCR synthetic price missing');writeFileSync(process.env.TD2_EVIDENCE_ROOT+'/packaged-ocr.json',JSON.stringify({sourceSha:process.env.TD2_PRODUCT_SHA,verdict:'PASS',synthetic:true,worker:'packaged Electron + offline packaged WASM/models',lineCount:lines.length}));"
          if($LASTEXITCODE -ne 0){throw 'Packaged OCR verification/execution failed'}
          $resources='release-electron-p0/win-unpacked/resources'
          foreach($cli in @('purchase-excel-cli','official-document-cli','my-finance-cli','chatgpt-auth-cli')) {
            $file=Join-Path $resources "$cli/$cli.exe"
            if(!(Test-Path $file)){throw "Missing packaged native CLI: $cli"}
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $cli.exe" | Add-Content "$env:TD2_EVIDENCE_ROOT/NATIVE-SHA256.txt"
          }
          $manifest=Get-Content "$resources/chatgpt-auth-cli/manifest.json" -Raw|ConvertFrom-Json
          if($manifest.sourceSha -cne 'b9a0a1b3893c2f45eeeed7278b86442e415dc159' -or $manifest.dirty){throw 'Native source provenance mismatch'}
          node -e "const {createPackageFromStreams}=require('@electron/asar');const asar=require('@electron/asar');const p='release-electron-p0/win-unpacked/resources/app.asar';const fs=require('fs');const meta=JSON.parse(asar.extractFile(p,'build-meta.json'));if(meta.sourceSha!==process.env.TD2_PRODUCT_SHA)throw Error('ASAR source mismatch');for(const f of ['purchase-ai-protocol.js','ai-image-capabilities.json'])asar.extractFile(p,f);fs.writeFileSync(process.env.TD2_EVIDENCE_ROOT+'/asar-source.json',JSON.stringify(meta));"
          if($LASTEXITCODE -ne 0){throw 'ASAR provenance/resource verification failed'}
      - name: Prove profile isolation and cleanup after injected exception
        working-directory: source
        run: |
          $env:TD2_FORCE_EXCEPTION='1'
          node ../controller/scripts/qa/td2-soft-rose-portable.mjs
          if($LASTEXITCODE -ne 0){throw 'Exception cleanup/profile gate failed'}
      - name: Run actual Portable and capture Electron GUI
        working-directory: source
        run: node ../controller/scripts/qa/td2-soft-rose-portable.mjs 2>&1 | Tee-Object "$env:TD2_EVIDENCE_ROOT/portable-gui.log"
      - name: Verify clean shutdown and finalize evidence
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $remaining=@(Get-CimInstance Win32_Process|Where-Object{$_.Name -like 'BOGUNON*' -or $_.ExecutablePath -like "$env:TD2_ROOT/*"})
          [ordered]@{count=$remaining.Count;processes=@($remaining|Select-Object ProcessId,Name,ExecutablePath)}|ConvertTo-Json -Depth 4|Set-Content "$env:TD2_EVIDENCE_ROOT/process-cleanup.json"
          if($remaining.Count){throw 'Residual BOGUNON QA process detected'}
          $files=@(Get-ChildItem $env:TD2_EVIDENCE_ROOT -Recurse -File|Where-Object Name -ne 'SHA256SUMS.txt'|Sort-Object FullName)
          @($files|ForEach-Object{"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.FullName.Substring($env:TD2_EVIDENCE_ROOT.Length+1).Replace('\','/'))"})|Set-Content "$env:TD2_EVIDENCE_ROOT/SHA256SUMS.txt"
          '## Final integrated Portable Windows QA' >> $env:GITHUB_STEP_SUMMARY
          "Product SHA: ``$env:TD2_PRODUCT_SHA``" >> $env:GITHUB_STEP_SUMMARY
          'Inspect result JSON: screenshots and actual source SHA are evidence only when execution passed the isolation gate.' >> $env:GITHUB_STEP_SUMMARY
          '125% and 150% remain NOT VERIFIED unless the recorded Windows OS DPI proves otherwise; no zoom/device emulation was used.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Portable GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-soft-rose-portable-gui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/td2-portable-${{ github.run_id }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload separate Portable executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() || failure()
        with:
          name: final-integrated-portable-f3b303e-${{ github.run_id }}
          path: source/release-electron-p0/*.exe
          if-no-files-found: ignore
          retention-days: 14
