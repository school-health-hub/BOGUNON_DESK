name: Finance Windows default CLI compile only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-default-compile:
    if: github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/ci/finance-win32-security-compile'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PRODUCT_SHA: d779e121b5abeb69887abf399bd9c08ad64d54fa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d779e121b5abeb69887abf399bd9c08ad64d54fa
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify source and MSVC prerequisites
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:PRODUCT_SHA -or (git status --porcelain)) { throw 'Product source identity mismatch' }
          New-Item -ItemType Directory -Force compile-evidence | Out-Null
          foreach ($tool in @('C:\Strawberry\perl\bin','C:\Program Files\NASM')) { if (Test-Path $tool) { $tool | Out-File -FilePath $env:GITHUB_PATH -Append } }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust unavailable' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo unavailable' }
      - name: Compile using unmodified default product build script (no extra features)
        shell: pwsh
        run: |
          node scripts/electron-p0/build-finance.mjs --release 2>&1 | Tee-Object compile-evidence/default-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Default Finance release compile failed' }
          if (-not (Test-Path build/my-finance-cli/my-finance-cli.exe)) { throw 'Default product build output missing' }
      - name: Locked Rust release check and effective Windows features
        shell: pwsh
        run: |
          cargo check --locked --release --manifest-path tools/my-finance-cli/Cargo.toml 2>&1 | Tee-Object compile-evidence/cargo-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Locked Finance Rust check failed' }
          cargo tree --locked --manifest-path tools/my-finance-cli/Cargo.toml -e features -i windows-sys@0.61.2 2>&1 | Tee-Object compile-evidence/windows-features.txt
          if ($LASTEXITCODE -ne 0) { throw 'Feature resolution failed' }
          if (-not (Select-String -Path compile-evidence/windows-features.txt -Pattern 'Win32_Security' -Quiet)) { throw 'Win32_Security was not resolved from the product manifest' }
          git diff --exit-code -- tools/my-finance-cli/Cargo.toml tools/my-finance-cli/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo source/lock was unexpectedly modified' }
          $dirty=@(git status --porcelain --untracked-files=no)
          if ($dirty.Count -ne 0) { throw 'Tracked product file changed' }
          @{sourceSha=$env:PRODUCT_SHA;qaSha=$env:GITHUB_SHA;defaultBuild='PASS';extraCargoFeatures=@();cargoCheck='PASS';cliSha256=(Get-FileHash build/my-finance-cli/my-finance-cli.exe -Algorithm SHA256).Hash.ToLowerInvariant();portableBuilt=$false;guiRun=$false;productionDeployment=$false} | ConvertTo-Json -Depth 4 | Set-Content compile-evidence/result.json
      - name: Preserve compile evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Finance-default-Windows-compile-${{ github.run_id }}
          path: compile-evidence/
          retention-days: 7
          if-no-files-found: warn
