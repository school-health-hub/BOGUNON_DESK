name: DESIGN-06 Soft Rose Windows Visual QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design04b-soft-rose-visual
  cancel-in-progress: false
jobs:
  visual:
    if: github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/qa/design06-integration-visual'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: QA tooling at dispatched SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed product, isolated checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9f6a3c8b2111c250c56bea03b8333ee3e9988bbf
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Verify approved product source
        working-directory: product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '9f6a3c8b2111c250c56bea03b8333ee3e9988bbf') { throw 'Wrong product SHA' }
          if (git status --porcelain) { throw 'Dirty product checkout' }
      - run: npm ci --no-audit --no-fund
        working-directory: product
      - name: Existing Electron build, no Rust or packaging QA
        working-directory: product
        run: npm run electron:p0:build
      - name: Windows settings preservation and EPERM regressions
        working-directory: product
        run: npx vitest run --maxWorkers=2 electron-p0/tests/settings-replacement.test.ts electron-p0/tests/settings.test.ts
      - name: Windows formal ASAR runtime graph check
        working-directory: product
        run: node --test scripts/electron-p0/runtime-package.test.mjs
      - name: Copy QA-only test after clean product build
        shell: pwsh
        run: Copy-Item electron-p0/e2e/soft-rose-visual.e2e.ts product/electron-p0/e2e/soft-rose-visual.e2e.ts
      - name: Actual Electron Surface and overlays, four window sizes
        working-directory: product
        env:
          DESIGN_QA_SHA: ${{ github.sha }}
        run: npx playwright test --config electron-p0/playwright.config.ts soft-rose-visual.e2e.ts --reporter=list,github
      - name: Preserve screenshots, manifests and failure traces only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DESIGN-06-Windows-Visual-${{ github.sha }}
          path: |
            product/artifacts/design06/
            product/artifacts/electron-p0-e2e/
          retention-days: 7
          if-no-files-found: warn
