name: Official document files focused Windows checks
on:
  push:
    branches: [codex/electron-official-document-files-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  files:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Only official-document Rust contracts and CLI
        run: cargo test --locked --manifest-path tools/official-document-cli/Cargo.toml
      - name: Only official-document IPC, file preservation and UI contracts
        run: npx vitest run electron-p0/tests/official-document --maxWorkers=4
      - name: TypeScript and Electron production build (no seven-feature QA)
        run: npm run electron:p0:build
