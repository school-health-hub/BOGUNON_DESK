name: Electron CLOUD-G0 integration
on:
  push:
    branches: [codex/cloud-g0-integration-stabilization, integration/school-05-account-02b-qa]
  workflow_dispatch:
    inputs:
      h1_focus:
        description: H1 only; other approved jobs keep their existing scope
        type: choice
        options: [all, http-only]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  integration:
    if: github.ref == 'refs/heads/codex/cloud-g0-integration-stabilization'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare original Rust fixtures then integrated Electron automated tests
        run: npm run electron:p0:test
      - name: Electron TypeScript and production build
        run: npm run electron:p0:build
      - name: Only integrated entries (no file-dialog or full Windows QA repeat)
        run: npx playwright test --config electron-p0/playwright.config.ts dashboard.e2e.ts --grep CLOUD-G0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CLOUD-G0-entry-evidence-${{ github.sha }}
          path: artifacts/electron-p0-e2e/
          if-no-files-found: ignore
          retention-days: 7

  account-configured-portable:
    if: github.ref == 'refs/heads/integration/school-05-account-02b-qa' && github.run_attempt == 1
    uses: ./.github/workflows/electron-p0-windows.yml
    secrets:
      public_url: ${{ vars.VITE_SUPABASE_URL }}
      public_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

  td2-floating-b-focused:
    name: Frozen TD2 B home and Dock QA only
    if: github.event_name == 'workflow_dispatch' && github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/fix/td2-b-memo-dock'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      TD2_DESIGN_SHA: abf6f6f049f01dc57a574825fad8be86e2a4d68a
      TD2_FOCUSED_QA: '1'
      TD2_MEMO_FIX_REQUIRED: '1'
    steps:
      - name: Checkout immutable approved design source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify source and isolate synthetic profile
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Controller SHA mismatch' }
          $allowed=@('electron-p0/renderer/P0App.tsx','electron-p0/renderer/QuickMemoSurface.tsx','electron-p0/renderer/quick-memo-surface.css','electron-p0/tests/quick-memo-surface.test.tsx')
          $changed=@(git diff --name-only $env:TD2_DESIGN_SHA HEAD -- electron-p0 src src-tauri tools config package.json package-lock.json DESIGN.md)
          if ($LASTEXITCODE -ne 0 -or @($changed|Where-Object{$_ -notin $allowed}).Count) { throw 'Changes exceed the approved quick-memo-only fix boundary' }
          if (git status --porcelain) { throw 'Dirty design source' }
          $root=Join-Path $env:RUNNER_TEMP "td2-b-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory "$root/evidence","$root/temp","$root/npm-cache" | Out-Null
          "TEMP=$root/temp" >> $env:GITHUB_ENV
          "TMP=$root/temp" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm-cache" >> $env:GITHUB_ENV
          "TD2_QA_TEMP=$root/profile-root" >> $env:GITHUB_ENV
          "TD2_REVIEW_DIR=$root/evidence" >> $env:GITHUB_ENV
          [ordered]@{designSha=$env:TD2_DESIGN_SHA;qaBaseline='985aa25ac5af950191690f59b80217567ce0d0f9';productSha=$env:GITHUB_SHA;controllerSha=$env:GITHUB_SHA;changedProductFiles=$changed;runner='windows-2022';runId=$env:GITHUB_RUN_ID;osDpi='NOT RUN';deployment=$false;portableReplacement=$false} | ConvertTo-Json | Set-Content "$root/evidence/provenance.json"
      - name: Install existing locked dependencies
        run: npm ci
      - name: Quick Memo regression and existing focused renderer tests
        run: |
          node node_modules/typescript/bin/tsc -p electron-p0/tsconfig.renderer.json --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Renderer type check failed' }
          node node_modules/vitest/vitest.mjs run electron-p0/tests/quick-memo-surface.test.tsx electron-p0/tests/soft-rose-surface.test.tsx electron-p0/tests/widget-state-notices.test.tsx src/dashboard/deskGeometry.test.ts src/dock/AppDock.test.tsx src/dock/storage.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Focused tests failed' }
      - name: Prepare unpackaged QA runtime without Portable or Rust rebuild
        run: npm run electron:p0:build
      - name: Ensure the lockfile-pinned Windows Electron executable
        run: |
          $ErrorActionPreference='Stop'
          if (!(Test-Path 'node_modules/electron/dist/electron.exe')) {
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron runtime installation failed' }
          }
          node -e "const fs=require('fs');const version=require('electron/package.json').version;if(version!=='45.2.1'||!fs.existsSync('node_modules/electron/dist/electron.exe'))throw Error('Pinned Windows Electron executable missing');"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows Electron verification failed' }
      - name: Native Electron synthetic long-data and restart checks
        run: |
          $env:TD2_ELECTRON_PATH=Join-Path $pwd 'node_modules/electron/dist/electron.exe'
          node scripts/qa/td2-b-review.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Focused Electron QA failed' }
      - name: Inventory evidence
        if: always()
        run: |
          if (Test-Path $env:TD2_REVIEW_DIR) {
            Get-ChildItem $env:TD2_REVIEW_DIR -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName).Hash)  $($_.Name)" } | Set-Content "$env:TD2_REVIEW_DIR/SHA256SUMS.txt"
          }
          'Frozen design QA only. Windows OS DPI, physical PC and integration approval: NOT RUN.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-b-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TD2_REVIEW_DIR }}
          retention-days: 14
          if-no-files-found: warn

  school-td2-candidate:
    name: SCHOOL Workspace plus TD2 candidate Windows QA
    if: github.event_name == 'workflow_dispatch' && github.repository == 'school-health-hub/BOGUNON_DESK' && (github.ref == 'refs/heads/integration/school-workspace-td2-candidate' || (github.ref == 'refs/heads/feature/school-hosted-h1' && inputs.h1_focus != 'http-only'))
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      SCHOOL_TD2_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Isolate current source and canonical frozen SQL
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Dirty or unexpected source' }
          $root=Join-Path $env:RUNNER_TEMP "td2-portable-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory "$root/evidence","$root/temp","$root/profile","$root/npm-cache"|Out-Null
          "TD2_ROOT=$root" >> $env:GITHUB_ENV
          "TD2_EVIDENCE_ROOT=$root/evidence" >> $env:GITHUB_ENV
          "TD2_EXPECTED_SOURCE_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "TD2_PRODUCT_ROOT=$pwd" >> $env:GITHUB_ENV
          "TEMP=$root/temp" >> $env:GITHUB_ENV
          "TMP=$root/temp" >> $env:GITHUB_ENV
          "ELECTRON_P0_QA_ROOT=$root/profile" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm-cache" >> $env:GITHUB_ENV
          git config --local core.autocrlf input
          git config --local core.eol lf
          'school-workspace/** -text'|Add-Content .git/info/attributes
          node scripts/qa/school-td2-canonical.mjs
          $checkout=@(git status --porcelain)
          $checkout|Set-Content "$root/evidence/checkout-state.txt"
          if ($LASTEXITCODE -ne 0 -or $checkout.Count) { $checkout|Write-Output;throw 'Canonical checkout changed source' }
          if ($env:GITHUB_REF -eq 'refs/heads/feature/school-hosted-h1') {
            git diff --exit-code 3ed1be5765b9abad4115de0d30b76088407c4539 HEAD -- electron-p0/renderer electron-p0/preload school-workspace/instructors src src-tauri tools package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { throw 'H1 protected product scope changed' }
          } else { node scripts/qa/school-td2-scope.mjs }
          python school-workspace/school09d0/tools/verify.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen D0 boundary failed' }
      - name: Install exact locked dependencies and Electron
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed' }
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue; node node_modules/electron/install.js }
          if ($LASTEXITCODE -ne 0 -or !(Test-Path node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron missing' }
          "TD2_PORTABLE_EXE=$pwd/node_modules/electron/dist/electron.exe" >> $env:GITHUB_ENV
      - name: Build new unpackaged source without Portable or native rebuild
        id: candidate-build
        run: |
          npm run electron:p0:build
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
          node node_modules/typescript/bin/tsc -p school-workspace/school05/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Workspace strict types failed' }
          node node_modules/vite/bin/vite.js build --config school-workspace/school05/vite.config.ts
          if ($LASTEXITCODE -ne 0) { throw 'Workspace Web build failed' }
          node -e "const m=require('./build/electron-p0-app/build-meta.json');if(m.sourceSha!==process.env.GITHUB_SHA||m.dirty)throw Error('Built source mismatch');"
          node scripts/qa/school05-build-native-provider.mjs
          if ($LASTEXITCODE -ne 0) { throw 'External QA provider build failed' }
      - name: H1 external provider and strict types
        if: github.ref == 'refs/heads/feature/school-hosted-h1'
        run: |
          node node_modules/typescript/bin/tsc -p school-workspace/hosted-h1/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'H1 strict types failed' }
          node scripts/qa/school-h1-build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'H1 provider build failed' }
          node --test scripts/qa/td2-process-ownership.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'QA process ownership regression failed' }
          node node_modules/vitest/vitest.mjs run school-workspace/hosted-h1/tests --reporter=json --outputFile="$env:TD2_EVIDENCE_ROOT/h1-unit.json"
          if ($LASTEXITCODE -ne 0) { throw 'H1 unit regression failed' }
      - name: Focused UI and business contract tests
        run: |
          node node_modules/vitest/vitest.mjs run electron-p0/tests/quick-memo-surface.test.tsx electron-p0/tests/soft-rose-surface.test.tsx src/dashboard/deskGeometry.test.ts src/dock/AppDock.test.tsx school-workspace/school07/tests/client.test.ts school-workspace/school05/tests/boundary.test.ts school-workspace/instructors/tests/contracts.test.ts school-workspace/instructors/tests/files.test.ts school-workspace/instructors/tests/lifecycle.test.ts school-workspace/instructors/tests/ui.test.tsx school-workspace/instructors/tests/preview-layers.test.tsx --reporter=json --outputFile="$env:TD2_EVIDENCE_ROOT/focused.json"
          if ($LASTEXITCODE -ne 0) { throw 'Focused regression failed' }
      - name: Start isolated SCHOOL08 cumulative DB and separate Instructor fixture
        run: pwsh -NoProfile -File scripts/qa/school08-native-pg.ps1 -Action Start
      - name: Actual local PostgreSQL domain and Instructor contracts
        run: |
          node node_modules/vitest/vitest.mjs run --config scripts/qa/school08-windows.vitest.config.ts --reporter=json --outputFile="$env:TD2_EVIDENCE_ROOT/native-db.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native SQL contracts failed' }
      - name: Actual Windows Workspace and Instructor GUI without Portable
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/feature/school-hosted-h1') { node scripts/qa/school-h1-windows.mjs } else { node scripts/qa/school05-windows.mjs }
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows GUI failed' }
      - name: Stop owned SCHOOL08 DB
        if: always() && env.SCHOOL05_PG_DATA != ''
        run: pwsh -NoProfile -File scripts/qa/school08-native-pg.ps1 -Action Stop
      - name: TD2 and Quick Memo actual Windows regression
        if: ${{ !cancelled() && steps.candidate-build.conclusion == 'success' }}
        env:
          TD2_FOCUSED_QA: '1'
          TD2_MEMO_FIX_REQUIRED: '1'
        run: |
          $env:TD2_ELECTRON_PATH=Join-Path $pwd 'node_modules/electron/dist/electron.exe'
          $env:TD2_QA_TEMP=Join-Path $env:TD2_ROOT 'td2-profile'
          $env:TD2_REVIEW_DIR=Join-Path $env:TD2_EVIDENCE_ROOT 'td2'
          node scripts/qa/td2-b-review.mjs
          if ($LASTEXITCODE -ne 0) { throw 'TD2 GUI regression failed' }
      - name: Start separate supported Auth CLOSED candidate DB
        id: supported-db
        if: ${{ !cancelled() && steps.candidate-build.conclusion == 'success' && github.ref != 'refs/heads/feature/school-hosted-h1' }}
        run: pwsh -NoProfile -File scripts/qa/school09-native-pg.ps1 -Action Start
      - name: Actual supported Auth and CLOSED SQL security assertions
        if: ${{ !cancelled() && steps.supported-db.conclusion == 'success' }}
        run: python scripts/qa/school09-native-security.py
      - name: Stop owned supported Auth DB
        if: always() && env.SCHOOL05_PG_DATA != ''
        run: |
          if ((Split-Path $env:SCHOOL05_PG_DATA -Leaf) -eq 'school09-pg-data') { pwsh -NoProfile -File scripts/qa/school09-native-pg.ps1 -Action Stop }
      - name: Hash synthetic evidence
        if: always()
        run: |
          if (Test-Path $env:TD2_EVIDENCE_ROOT) { Get-ChildItem $env:TD2_EVIDENCE_ROOT -File -Recurse|Where-Object Name -ne SHA256SUMS.txt|ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $([IO.Path]::GetRelativePath($env:TD2_EVIDENCE_ROOT,$_.FullName).Replace('\','/'))" }|Set-Content "$env:TD2_EVIDENCE_ROOT/SHA256SUMS.txt" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: school-td2-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TD2_EVIDENCE_ROOT }}
          retention-days: 14
          if-no-files-found: warn

  td2-all-menu-design:
    name: TD2 all menus Windows UI only (SCHOOL06-08)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'school-health-hub/BOGUNON_DESK' && (github.ref == 'refs/heads/feature/electron-td2-all-menu-school08' || github.ref == 'refs/heads/fix/td2-functional-stability') && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify UI-only scope and isolate QA data outside uploaded evidence
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source SHA' }
          $root=Join-Path $env:RUNNER_TEMP "td2-portable-menu-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory "$root/evidence","$root/temp","$root/profile","$root/npm-cache","$root/cargo-home"|Out-Null
          "TD2_ROOT=$root" >> $env:GITHUB_ENV
          "TD2_EVIDENCE_ROOT=$root/evidence" >> $env:GITHUB_ENV
          "TD2_UI_EVIDENCE=$root/evidence/menus" >> $env:GITHUB_ENV
          "TD2_UI_PROFILE_ROOT=$root/profile/menus" >> $env:GITHUB_ENV
          "TEMP=$root/temp" >> $env:GITHUB_ENV
          "TMP=$root/temp" >> $env:GITHUB_ENV
          "npm_config_cache=$root/npm-cache" >> $env:GITHUB_ENV
          "CARGO_HOME=$root/cargo-home" >> $env:GITHUB_ENV
          git config --local core.autocrlf input
          git config --local core.eol lf
          'school-workspace/** -text'|Add-Content .git/info/attributes
          node scripts/qa/school-td2-canonical.mjs
          if ($LASTEXITCODE -ne 0 -or (git status --porcelain)) { throw 'Unclean canonical checkout' }
          git diff --exit-code ec181a18f94c5ff4730dc6006ea94018db28d5e3 HEAD -- electron-p0/main electron-p0/preload electron-p0/protocol.ts electron-p0/workspace-protocol.ts electron-p0/builder.json school-workspace src tools config package.json package-lock.json electron-p0/renderer/QuickMemoSurface.tsx electron-p0/renderer/quick-memo-surface.css electron-p0/renderer/td2-desktop.css electron-p0/renderer/td2-desktop-v2.css electron-p0/renderer/td2-desktop-b.css
          if ($LASTEXITCODE -ne 0) { throw 'Protected product contract changed' }
          [ordered]@{sourceSha=$env:GITHUB_SHA;baseSha='ec181a18f94c5ff4730dc6006ea94018db28d5e3';runner='windows-2025';portableBuilt=$false;hostedActivated=$false;actualApiCalls=$false} | ConvertTo-Json | Set-Content "$root/evidence/provenance.json"
      - name: Install locked dependencies and exact Windows Electron
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue; node node_modules/electron/install.js }
          if ($LASTEXITCODE -ne 0 -or !(Test-Path node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron missing' }
          "ELECTRON_P0_EXECUTABLE=$pwd/node_modules/electron/dist/electron.exe" >> $env:GITHUB_ENV
      - name: Existing Electron build and original Finance CLI only
        run: |
          npm run electron:p0:build
          if ($LASTEXITCODE -ne 0) { throw 'Electron production build failed' }
          node -e "const m=require('./build/electron-p0-app/build-meta.json');if(m.sourceSha!==process.env.GITHUB_SHA||m.dirty)throw Error('Build source/clean mismatch');"
          if ($LASTEXITCODE -ne 0) { throw 'Build provenance failed' }
          node scripts/qa/school05-build-native-provider.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Existing isolated provider build failed' }
      - name: Original Windows Excel CLI for selected-row integration regression
        if: github.ref == 'refs/heads/fix/td2-functional-stability'
        run: |
          node scripts/electron-p0/build-excel.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Excel prerequisite build failed' }
      - name: Original Windows Finance CLI, no replacement storage
        if: github.ref != 'refs/heads/fix/td2-functional-stability'
        id: finance-runtime
        continue-on-error: true
        run: |
          node scripts/electron-p0/build-finance.mjs --release *> "$env:TD2_EVIDENCE_ROOT/finance-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Finance unavailable; other independent menu captures continue' }
          # Main's existing unpackaged boundary intentionally resolves target/debug.
          # Reuse the exact release bytes built above; do not change Main or encryption.
          $from=Join-Path $pwd 'build/my-finance-cli/my-finance-cli.exe'
          $to=Join-Path $pwd 'tools/my-finance-cli/target/debug/my-finance-cli.exe'
          if (Test-Path $to) { throw 'Refusing to overwrite an existing native QA binary' }
          New-Item -ItemType Directory (Split-Path $to) -Force | Out-Null
          Copy-Item -LiteralPath $from -Destination $to
          $hash=(Get-FileHash -LiteralPath $from -Algorithm SHA256).Hash
          if ($hash -cne (Get-FileHash -LiteralPath $to -Algorithm SHA256).Hash) { throw 'Finance QA copy hash mismatch' }
          [ordered]@{sourceSha=$env:GITHUB_SHA;buildMode='release';qaPlacement='Existing unpackaged Main target/debug path';sha256=$hash;productMainChanged=$false} | ConvertTo-Json | Set-Content "$env:TD2_EVIDENCE_ROOT/finance-native-resource.json"
      - name: Focused presentation and role-boundary tests only
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/fix/td2-functional-stability') {
            node node_modules/vitest/vitest.mjs run electron-p0/tests/school-profile-ui.test.tsx electron-p0/tests/admin-domain.test.ts electron-p0/tests/admin-preload.test.ts --reporter=json --outputFile="$env:TD2_EVIDENCE_ROOT/excel-regression.json"
            if ($LASTEXITCODE -ne 0) { throw 'Native Excel UI/IPC regression failed' }
          }
          node node_modules/vitest/vitest.mjs run electron-p0/tests/td2-workspace-ui.test.tsx electron-p0/tests/soft-rose-surface.test.tsx electron-p0/tests/quick-memo-surface.test.tsx school-workspace/school07/tests/client.test.ts school-workspace/school05/tests/boundary.test.ts school-workspace/instructors/tests/ui.test.tsx school-workspace/instructors/tests/preview-layers.test.tsx --reporter=json --outputFile="$env:TD2_EVIDENCE_ROOT/focused.json"
          if ($LASTEXITCODE -ne 0) { throw 'Focused UI regression failed' }
      - name: Reuse isolated native SCHOOL08 QA fixtures (never Hosted)
        if: github.ref != 'refs/heads/fix/td2-functional-stability'
        id: school-db
        continue-on-error: true
        run: pwsh -NoProfile -File scripts/qa/school08-native-pg.ps1 -Action Start
      - name: Actual Windows Electron all-menu captures and synthetic shared screens
        env:
          TD2_UI_SYNTHETIC_SCHOOL: ${{ steps.school-db.outcome == 'success' && '1' || '0' }}
          TD2_UI_REQUIRE_FINANCE: ${{ github.ref != 'refs/heads/fix/td2-functional-stability' && '1' || '0' }}
          TD2_UI_MENUS: ${{ github.ref == 'refs/heads/fix/td2-functional-stability' && 'home,tasks,memo-protected,school-admin-excel' || '' }}
        run: |
          node scripts/qa/td2-workspace-gui.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows GUI verification failed; see independent menu records' }
      - name: Preserve independent runtime outcomes
        if: always() && env.TD2_EVIDENCE_ROOT != ''
        run: |
          [ordered]@{financeBuild='${{ steps.finance-runtime.outcome }}';schoolFixture='${{ steps.school-db.outcome }}';hosted='NOT RUN';portable='NOT RUN'} | ConvertTo-Json | Set-Content "$env:TD2_EVIDENCE_ROOT/runtime-outcomes.json"
      - name: Stop only the existing job-owned QA database
        if: always() && env.SCHOOL05_PG_DATA != ''
        run: pwsh -NoProfile -File scripts/qa/school08-native-pg.ps1 -Action Stop
      - name: Upload synthetic screenshots and manifests, never profiles or DB files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-all-menu-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TD2_EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 14

  school-h1-http:
    name: SCHOOL H1 isolated real Auth HTTP PostgREST
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/school-hosted-h1' && github.repository == 'school-health-hub/BOGUNON_DESK'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict H1 types and bounded transport tests
        run: |
          node node_modules/typescript/bin/tsc -p school-workspace/hosted-h1/tsconfig.json
          node node_modules/vitest/vitest.mjs run school-workspace/hosted-h1/tests --reporter=dot
      - name: Real isolated GoTrue PostgREST and CLOSED database contracts
        env:
          H1_EVIDENCE_ROOT: ${{ runner.temp }}/school-h1-evidence
        run: node school-workspace/hosted-h1/qa/ci.mjs
      - name: Upload sanitized booleans only, never status sessions or DB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: school-h1-http-${{ github.run_id }}
          path: ${{ runner.temp }}/school-h1-evidence/http-summary.json
          retention-days: 14
          if-no-files-found: warn
