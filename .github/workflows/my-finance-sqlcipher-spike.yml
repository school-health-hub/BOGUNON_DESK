name: MY FINANCE SQLCipher Windows compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/my-finance-sqlcipher-spike.yml"

permissions:
  contents: read

jobs:
  sqlcipher-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Create isolated SQLCipher probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sqlcipher-probe/src | Out-Null
          @'
          [package]
          name = "sqlcipher-probe"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
          '@ | Set-Content -Path sqlcipher-probe/Cargo.toml
          @'
          fn main() {
              let path = std::env::temp_dir().join(format!("bogunon-sqlcipher-probe-{}.db", std::process::id()));
              let key = "probe-secret";
              {
                  let db = rusqlite::Connection::open(&path).expect("open");
                  db.pragma_update(None, "key", key).expect("key");
                  let version: String = db.query_row("PRAGMA cipher_version", [], |row| row.get(0)).expect("SQLCipher must be enabled");
                  assert!(!version.is_empty(), "plain SQLite is forbidden");
                  db.execute_batch("CREATE TABLE probe(value TEXT); INSERT INTO probe VALUES ('encrypted');").expect("SQL works");
              }
              let bytes = std::fs::read(&path).expect("read encrypted file");
              assert!(!bytes.starts_with(b"SQLite format 3"), "database file is plaintext SQLite");
              assert!(!bytes.windows(b"encrypted".len()).any(|window| window == b"encrypted"), "plaintext leaked to file");
              {
                  let wrong = rusqlite::Connection::open(&path).expect("open with wrong key");
                  wrong.pragma_update(None, "key", "wrong-key").expect("set wrong key");
                  assert!(wrong.query_row("SELECT value FROM probe", [], |row| row.get::<_, String>(0)).is_err(), "wrong key must fail");
              }
              {
                  let db = rusqlite::Connection::open(&path).expect("reopen");
                  db.pragma_update(None, "key", key).expect("key");
                  let value: String = db.query_row("SELECT value FROM probe", [], |row| row.get(0)).expect("read");
                  assert_eq!(value, "encrypted");
              }
              std::fs::remove_file(&path).expect("cleanup");
              println!("SQLCipher file encryption, wrong-key rejection and reopen verified");
          }
          '@ | Set-Content -Path sqlcipher-probe/src/main.rs
      - name: Locate OpenSSL for bundled SQLCipher
        shell: pwsh
        run: |
          $roots = @(
            "C:/Program Files/OpenSSL-Win64",
            "C:/Program Files/OpenSSL",
            "C:/OpenSSL-Win64"
          )
          $root = $roots | Where-Object { (Test-Path "$_/include/openssl/evp.h") -and ((Test-Path "$_/lib/libcrypto.lib") -or (Test-Path "$_/lib/VC/x64/MD/libcrypto.lib")) } | Select-Object -First 1
          if (-not $root) { throw "OpenSSL headers and MSVC libraries were not found; install a compatible OpenSSL distribution before retrying." }
          $libDir = if (Test-Path "$root/lib/libcrypto.lib") { "$root/lib" } else { "$root/lib/VC/x64/MD" }
          "OPENSSL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$root/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OpenSSL detected for MSVC"
      - name: Verify bundled SQLCipher compiles, links and runs on MSVC
        run: cargo run --manifest-path sqlcipher-probe/Cargo.toml --release --target x86_64-pc-windows-msvc
