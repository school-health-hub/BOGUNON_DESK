name: MY FINANCE verification

on:
  pull_request:
    paths:
      - "src/my-finance/**"
      - "src-tauri/src/my_finance_*.rs"
      - "src-tauri/src/lib.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/my-finance-check.yml"
  workflow_dispatch:

concurrency:
  group: my-finance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=4
      - run: npx tsc --noEmit
      - run: npm run build

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify vendored OpenSSL build prerequisites
        shell: pwsh
        run: |
          perl --version
          nasm -v
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc my_finance
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build integrated Windows app (no installer or release)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --no-bundle
      - name: Verify app has no external OpenSSL DLL dependency
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "MSVC dumpbin was not found." }
          $dependencies = & $dumpbin /dependents "src-tauri/target/x86_64-pc-windows-msvc/release/school-health-desk.exe"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect app DLL dependencies." }
          $dependencies | Write-Host
          if ($dependencies -match '(?i)libcrypto|libssl') { throw "App requires an external OpenSSL DLL." }
