name: MY FINANCE verification

on:
  pull_request:
    paths:
      - "src/my-finance/**"
      - "src-tauri/src/my_finance_*.rs"
      - "src-tauri/src/lib.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/my-finance-check.yml"
  workflow_dispatch:

concurrency:
  group: my-finance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=4
      - run: npx tsc --noEmit
      - run: npm run build

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Locate OpenSSL for bundled SQLCipher
        shell: pwsh
        run: |
          $roots = @(
            "C:/Program Files/OpenSSL-Win64",
            "C:/Program Files/OpenSSL",
            "C:/OpenSSL-Win64"
          )
          $root = $roots | Where-Object { (Test-Path "$_/include/openssl/evp.h") -and ((Test-Path "$_/lib/libcrypto.lib") -or (Test-Path "$_/lib/VC/x64/MD/libcrypto.lib")) } | Select-Object -First 1
          if (-not $root) { throw "OpenSSL headers and MSVC libraries were not found; install a compatible OpenSSL distribution before retrying." }
          $libDir = if (Test-Path "$root/lib/libcrypto.lib") { "$root/lib" } else { "$root/lib/VC/x64/MD" }
          "OPENSSL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$root/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "OpenSSL detected for MSVC"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml my_finance
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build integrated Windows app (no installer or release)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --no-bundle
