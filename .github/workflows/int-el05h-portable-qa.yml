name: Integrated Portable remaining usage (reuse verified EXE)
on:
  workflow_dispatch:
    inputs:
      expected_qa_sha:
        description: Exact reviewed QA branch SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-feature-portable
  cancel-in-progress: false
jobs:
  integrated-portable:
    if: github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/qa/electron-integrated-portable' && github.sha == inputs.expected_qa_sha
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      QA_REMAINING_ONLY: '1'
      QA_FINAL_FILES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_qa_sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9e22f7e5666ffa73afc48a03ff2c844ea67bc0c9
          path: product
          persist-credentials: false
      - name: Enforce fixed product and reviewed QA identities
        shell: pwsh
        env:
          EXPECTED_QA_SHA: ${{ inputs.expected_qa_sha }}
        run: |
          if ($env:EXPECTED_QA_SHA -notmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -ne $env:EXPECTED_QA_SHA -or $env:GITHUB_SHA -ne $env:EXPECTED_QA_SHA) { throw 'QA SHA mismatch' }
          if ((git -C product rev-parse HEAD) -ne '9e22f7e5666ffa73afc48a03ff2c844ea67bc0c9' -or (git -C product status --porcelain)) { throw 'Product source mismatch/dirty' }
          New-Item -ItemType Directory -Force diagnostic-output | Out-Null
          @{productSourceSha='9e22f7e5666ffa73afc48a03ff2c844ea67bc0c9';qaSha=$env:EXPECTED_QA_SHA;earlierBuildFailureRun=41606939989;financeBuildFeature='windows-sys/Win32_Security';productFilesModified=$false} | ConvertTo-Json | Set-Content diagnostic-output/build-identity.json
          foreach ($tool in @('C:\Strawberry\perl\bin','C:\Program Files\NASM')) { if (Test-Path $tool) { $tool | Out-File -FilePath $env:GITHUB_PATH -Append } }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install locked dependencies only
        working-directory: product
        run: npm ci
      - name: Verify immutable already-built Portable Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a=gh api repos/school-health-hub/BOGUNON_DESK/actions/artifacts/13218936720 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $a.expired -or $a.workflow_run.id -ne 41609316123 -or $a.digest -ne 'sha256:eca9fe8965beef92fdee1cf73377f5712e2634c5e64c5eb2f685dfa5cbdebf07') { throw 'Pinned Portable unavailable or changed' }
          $a | ConvertTo-Json -Depth 8 | Set-Content diagnostic-output/source-artifact.json
      - name: Reuse identical Portable only (no Rust or Electron build)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Integrated-Portable-9e22f7e-41609316123
          run-id: 41609316123
          repository: school-health-hub/BOGUNON_DESK
          github-token: ${{ github.token }}
          path: product/release-electron-p0
      - name: Verify reused EXE and prepare existing synthetic fixtures
        shell: pwsh
        run: |
          $path='product/release-electron-p0/INTEGRATED-PORTABLE-MANIFEST.json'
          $manifest=Get-Content $path -Raw | ConvertFrom-Json
          $exe=Join-Path 'product/release-electron-p0' $manifest.portable.file
          $signature=[string](Get-AuthenticodeSignature $exe).Status
          if ($signature -ne $manifest.portable.signature -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6ed9fc79c8d85e68bd43f1b33ba8acee73a2284e4cff05d97802670a7b7afb10' -or $manifest.productSourceSha -ne '9e22f7e5666ffa73afc48a03ff2c844ea67bc0c9' -or $manifest.metadata.dirty) { throw 'Reused Portable identity mismatch' }
          @{signature=$signature;sourceSha=$manifest.productSourceSha;sha256=$manifest.portable.sha256} | ConvertTo-Json | Set-Content diagnostic-output/reused-exe-identity.json
          node scripts/qa/int-el05h-ui.mjs --prepare
          if ($LASTEXITCODE -ne 0) { 'Synthetic newsletter fixture preparation failed; remaining GUI checks continue' | Set-Content diagnostic-output/fixture-preparation-warning.txt; $global:LASTEXITCODE=0 }
      - name: Actual Portable independent launch, owned HWND/CDP UI, restart and cleanup
        shell: pwsh
        run: ./scripts/qa/int-el05h-portable.ps1 -InputDirectory product/release-electron-p0 -OutputDirectory diagnostic-output
      - name: Preserve screenshots, files, hashes, independent results and process logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Integrated-Portable-usage-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 14
