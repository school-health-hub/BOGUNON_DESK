name: Desktop Surface C-1 Windows native boundary verification
on:
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        description: Exact reviewed workflow controller SHA; C0 source is fixed to ab5eb3f078b63428511d758137ba7747e54396f0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-surface-c1-native
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'school-health-hub/BOGUNON_DESK' && github.ref == 'refs/heads/feature/dashboard-mint-ivory-v2' && github.sha == inputs.expected_controller_sha && github.run_attempt == 1 }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [production, finance-qa]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      CI: 'true'
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      C1_WORKFLOW_SHA: ${{ github.workflow_sha }}
      C1_WORKFLOW_REF: ${{ github.workflow_ref }}
      C1_CONFIGURATION: ${{ matrix.configuration }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout reviewed controller only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable C0 source independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ab5eb3f078b63428511d758137ba7747e54396f0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fail closed before dependencies or compilation
        run: node ../controller/scripts/desktop-surface-c1.mjs guard ../controller .
      - name: Verify pinned actionlint and workflow
        run: |
          New-Item -ItemType Directory -Path diagnostics | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint_1.7.12_windows_amd64.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'c1-actionlint'
          Invoke-WebRequest -Uri 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9') { throw 'actionlint checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          & (Join-Path $toolDir 'actionlint.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'actionlint version failed' }
          & (Join-Path $toolDir 'actionlint.exe') ../controller/.github/workflows/desktop-surface-c1-native.yml
          if ($LASTEXITCODE -ne 0) { throw 'actionlint failed' }
      - name: Controller static contracts
        run: node --test ../controller/scripts/desktop-surface-c1.contract.mjs
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check hosted native prerequisites
        run: |
          perl --version
          if ($LASTEXITCODE -ne 0) { throw 'Perl missing' }
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM missing' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC x64 toolchain missing' }
      - name: Install locked frontend dependencies
        run: npm ci --loglevel=error
      - name: Preserve existing Main boundary contracts
        run: node --test scripts/main-boundary.contract.mjs
      - name: Full frontend regressions
        if: ${{ matrix.configuration == 'production' }}
        run: npm test -- --maxWorkers=4
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production frontend
        if: ${{ matrix.configuration == 'production' }}
        run: npm run build
      - name: Isolated Finance QA frontend and source stamp
        if: ${{ matrix.configuration == 'finance-qa' }}
        run: npm run qa:finance:frontend
      - name: Select exact compile configuration
        run: node ../controller/scripts/desktop-surface-c1.mjs prepare ../controller . $env:C1_CONFIGURATION
      - name: Compile all Tauri targets with locked dependencies
        run: |
          $features = @()
          if ($env:C1_CONFIGURATION -eq 'finance-qa') { $features = @('--features', 'my-finance-qa') }
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets @features --message-format=json > diagnostics/cargo-check.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Tauri all-target check failed' }
      - name: Rust Library regressions without application startup
        run: |
          $features = @()
          if ($env:C1_CONFIGURATION -eq 'finance-qa') { $features = @('--features', 'my-finance-qa') }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib @features
          if ($LASTEXITCODE -ne 0) { throw 'Rust Library tests failed' }
      - name: Bind exact generated source ACL and inventories
        run: node ../controller/scripts/desktop-surface-c1.mjs collect ../controller . $env:C1_CONFIGURATION diagnostics
      - name: Inspect actual generated Context authority using MockRuntime only
        run: cargo test --locked --manifest-path ../controller/qa/c1-acl/Cargo.toml --target x86_64-pc-windows-msvc -- --nocapture
      - name: Confirm tracked C0 source remains unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source index changed' }
      - name: Preserve diagnostic evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c1-boundary-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            source/diagnostics/cargo-check.jsonl
            source/diagnostics/inventory.json
            source/diagnostics/acl-manifests.json
            source/diagnostics/capabilities.json
            source/diagnostics/ACL-REPORT.json
