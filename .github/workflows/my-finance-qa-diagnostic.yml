name: MY FINANCE isolated Windows diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-finance-isolated-diagnostic
  cancel-in-progress: false

env:
  QA_SOURCE_SHA: f3f920d56045d24b8fc097ffcef224afd760a800
  OPERATING_REFERENCE_SHA: 5cec64358436c148710499b5aa9d2e78c34e0136

jobs:
  isolated-windows-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the reviewed QA source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify immutable QA source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:QA_SOURCE_SHA) {
            throw "Unexpected QA source: $actual"
          }
          if (git status --short) {
            throw 'QA source checkout is dirty'
          }

      - name: Check out immutable operating reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATING_REFERENCE_SHA }}
          path: operating-source
          persist-credentials: false

      - name: Capture read-only runner diagnostics
        shell: pwsh
        run: |
          $out = 'artifacts/my-finance-qa-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $versions = @(Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.VersionInfo.ProductVersion })
          $diagnostic = [ordered]@{
            sourceSha = $env:QA_SOURCE_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerElevated = $elevated
            webViewRuntimeVersions = $versions
          }
          $diagnostic | ConvertTo-Json -Depth 8 | Set-Content "$out/runner-diagnostic.json" -Encoding utf8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            operating-source/src-tauri

      - name: Parse destructive-test guards before build or install
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/qa/*finance*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Output "::error title=QA_SCRIPT_PARSE::$($_.Message)" }
              throw 'Invalid isolation script'
            }
          }

      - run: npm ci
      - run: npm test -- --maxWorkers=4
      - run: npm run build

      - name: Native finance and crypto regressions
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml my_finance

      - name: Reject mismatched feature and config combinations
        shell: pwsh
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features my-finance-qa *> qa-wrong-feature.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -Path qa-wrong-feature.log -Pattern 'QA feature requires QA config' -Quiet)) {
            throw 'Expected QA config guard failure'
          }
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.my-finance-qa.conf.json -Raw
          try {
            cargo check --locked --manifest-path src-tauri/Cargo.toml *> qa-wrong-config.log
            if ($LASTEXITCODE -eq 0 -or -not (Select-String -Path qa-wrong-config.log -Pattern 'QA config requires QA feature' -Quiet)) {
              throw 'Expected QA feature guard failure'
            }
          } finally {
            Remove-Item Env:TAURI_CONFIG
          }
          Remove-Item qa-wrong-feature.log,qa-wrong-config.log
          exit 0

      - name: Build immutable operating reference in the disposable runner
        working-directory: operating-source
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Operating reference npm ci failed' }
          npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Build separate finance-only diagnostic installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'my-finance-qa-build.log'
          npm run qa:finance:windows 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 30) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=MY_FINANCE_QA_BUILD_FAILURE::$tail"
            throw 'QA installer build failed'
          }

      - name: Verify static OpenSSL linking for the diagnostic binary
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'No dumpbin' }
          $binary = 'src-tauri/target/x86_64-pc-windows-msvc/release/bogunon-desk-my-finance-qa.exe'
          $deps = & $dumpbin /dependents $binary
          if ($LASTEXITCODE -ne 0 -or $deps -match '(?i)libcrypto|libssl') {
            throw 'QA native dependency check failed'
          }

      - name: Run synthetic co-install and CDP isolation diagnostic
        shell: pwsh
        run: |
          $env:QA_EXPECTED_SOURCE_SHA = $env:QA_SOURCE_SHA
          $operating = @(Get-ChildItem operating-source/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          $qa = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($operating.Count -ne 1 -or $qa.Count -ne 1) {
            throw 'Ambiguous installer inputs'
          }
          try {
            & ./scripts/qa/windows-my-finance-isolation.ps1 -OperatingInstaller $operating[0].FullName -QaInstaller $qa[0].FullName
          } catch {
            $message = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=MY_FINANCE_QA_DIAGNOSTIC_FAILURE::$message"
            throw
          }

      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MY-FINANCE-QA-DIAGNOSTIC-EVIDENCE-${{ github.run_id }}
          path: artifacts/my-finance-qa-evidence/**
          if-no-files-found: ignore
          retention-days: 14
