            ${{ runner.temp }}/c2d2-diagnostics/environment-rejected/cleanup-unknown.json
            ${{ runner.temp }}/c2d2-diagnostics/environment-rejected/retention-observation.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/case-report.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/timeline.jsonl
