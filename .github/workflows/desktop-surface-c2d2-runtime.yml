            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/udf-observation.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/runtime-summary.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/cleanup-receipt.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/cleanup-unknown.json
            ${{ runner.temp }}/c2d2-diagnostics/controller-rejected/retention-observation.json
            ${{ runner.temp }}/c2d2-diagnostics/environment-deadline/case-report.json
            ${{ runner.temp }}/c2d2-diagnostics/environment-deadline/timeline.jsonl
            ${{ runner.temp }}/c2d2-diagnostics/environment-deadline/ownership-ledger.json
            ${{ runner.temp }}/c2d2-diagnostics/environment-deadline/udf-observation.json
