name: Windows updater production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version already committed on main (for example, 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

jobs:
  publish-updater:
    name: Build, verify, and publish signed updater release
    runs-on: windows-latest
    timeout-minutes: 90
    environment: desktop-production-release
    env:
      CI: "true"
      RELEASE_VERSION: ${{ inputs.version }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Guard trusted main ref
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Production updater releases can only run from refs/heads/main."
          }
          "Trusted release commit: $env:GITHUB_SHA"

      - name: Check out trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify reviewed release version
        run: npm run release:version:check

      - name: Set trusted publish timestamp
        shell: pwsh
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          "RELEASE_PUBLISHED_AT=$publishedAt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and validate signed updater artifacts
        run: npm run release:updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish and remotely verify updater release
        run: npm run release:publish
        env:
          SUPABASE_RELEASE_STORAGE_KEY: ${{ secrets.SUPABASE_RELEASE_STORAGE_KEY }}

      - name: Write sanitized release summary
        shell: pwsh
        run: |
          $metadata = Get-Content "release-output/release-metadata.json" -Raw | ConvertFrom-Json
          @"
          ## BOGUNON DESK updater release

          - Version: $($metadata.version)
          - Commit: $env:GITHUB_SHA
          - Installer: $($metadata.installerUrl)
          - SHA256: $($metadata.sha256)
          - Bytes: $($metadata.bytes)
          - Publish status: verified
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: updater-release-evidence-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release-output/SHA256SUMS.txt
            release-output/release-metadata.json
            release-output/latest.json
