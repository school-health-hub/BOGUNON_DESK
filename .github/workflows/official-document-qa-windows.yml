name: Official document isolated Windows QA

on:
  workflow_dispatch:
    inputs:
      p11_bundled_template:
        description: Verify only bundled home-v1 routing and product save contracts
        type: boolean
        default: false
      p11_source_sha:
        description: Full feature commit SHA for Rust-only P11 tests (empty keeps existing QA modes)
        type: string
        default: ''
      p11_gui_only:
        description: Build latest native QA and check only authoring GUI without repeating suites
        type: boolean
        default: false
      p11_authoring_only:
        description: Check authoring UI and ODT request contracts without Rust builds
        type: boolean
        default: false
      p11_supported_template:
        description: Verify supported template versions and publish offline console validator
        type: boolean
        default: false
      p11_contract_only:
        description: Run only synthetic template contract probes without repeating the P11 suite
        type: boolean
        default: false
      runtime_only:
        description: Reuse the verified QA EXE without rebuilding
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: official-document-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p11-authoring:
    if: github.ref == 'refs/heads/feature/official-document-enhancement' && inputs.p11_authoring_only
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.p11_source_sha }}
          persist-credentials: false
      - name: Verify source and initialize evidence
        env:
          EXPECTED_SHA: ${{ inputs.p11_source_sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -ne $env:EXPECTED_SHA -or $env:EXPECTED_SHA -ne $env:GITHUB_SHA) { throw 'Exact source SHA required' }
          $root = Join-Path $env:RUNNER_TEMP 'p11-authoring'
          New-Item -ItemType Directory -Path $root | Out-Null
          "AUTHORING_EVIDENCE=$root" >> $env:GITHUB_ENV
          "PSModuleAnalysisCachePath=$root/ModuleAnalysisCache" >> $env:GITHUB_ENV
          @{ sourceSha=$env:EXPECTED_SHA; validation='TypeScript and jsdom component tests'; nativeGui='NOT RUN'; privateOdt='NOT UPLOADED'; rustBuild='NOT RUN' } | ConvertTo-Json | Set-Content "$root/provenance.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object "$env:AUTHORING_EVIDENCE/npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw 'Locked install failed' }
      - name: TypeScript
        if: '!inputs.p11_gui_only'
        run: |
          node node_modules/typescript/bin/tsc --noEmit 2>&1 | Tee-Object "$env:AUTHORING_EVIDENCE/typescript.log"
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
      - name: Authoring preview and export contracts
        run: |
          npm test -- src/components/desktop/OfficialDocumentPanel.interaction.test.tsx src/components/desktop/OfficialDocumentOutput.test.tsx src/components/desktop/OfficialDocumentOutput.quality.test.tsx src/official-document/officialDocumentExportService.test.ts --maxWorkers=2 2>&1 | Tee-Object "$env:AUTHORING_EVIDENCE/authoring-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Authoring tests failed' }
      - name: Verify source and lockfiles preserved
        if: always()
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked files changed' }
      - name: Preserve authoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11-authoring-${{ github.run_id }}
          path: ${{ env.AUTHORING_EVIDENCE }}/*
          if-no-files-found: warn
          retention-days: 14
  p11-rust:
    if: github.ref == 'refs/heads/feature/official-document-enhancement' && inputs.p11_source_sha != '' && !inputs.p11_authoring_only
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      P11_SOURCE_SHA: ${{ inputs.p11_source_sha }}
      CL: /utf-8
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.p11_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact feature source and initialize evidence
        run: |
          if ($env:P11_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full commit SHA required' }
          $actual = git rev-parse HEAD
          if ($actual -ne $env:P11_SOURCE_SHA) { throw 'Checkout SHA mismatch' }
          git merge-base --is-ancestor HEAD origin/feature/official-document-enhancement
          if ($LASTEXITCODE -ne 0) { throw 'Source must belong to the official-document feature history' }
          $root = Join-Path $env:RUNNER_TEMP 'p11-rust'
          New-Item -ItemType Directory -Path "$root/evidence" -Force | Out-Null
          "P11_ROOT=$root" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$root/target" >> $env:GITHUB_ENV
          "PSModuleAnalysisCachePath=$root/ModuleAnalysisCache" >> $env:GITHUB_ENV
          [ordered]@{ sourceSha=$actual; workflowSha=$env:GITHUB_SHA; nativeUi='NOT RUN'; productionOdt='NOT RUN'; fixtures='synthetic only' } | ConvertTo-Json | Set-Content "$root/evidence/provenance.json"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Verify existing Windows prerequisites
        run: |
          foreach ($tool in @('perl','nasm','cargo','rustc')) { Get-Command $tool -ErrorAction Stop | Select-Object Name,Source }
          rustc -vV
          cargo --version
      - name: Run minimal synthetic template contract probes
        if: inputs.p11_contract_only && !inputs.p11_supported_template && !inputs.p11_bundled_template
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml official_document_odt::tests::contract_probe --lib --locked --jobs 1 -- --nocapture 2>&1 | Tee-Object "$env:P11_ROOT/evidence/contract-probes.log"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic template contract probes failed' }
          if ((Get-Content "$env:P11_ROOT/evidence/contract-probes.log" -Raw) -notmatch 'test result: ok\. 6 passed; 0 failed; 0 ignored;') { throw 'Expected six contract probes without skips' }
      - name: Reproduce the two reported tests
        if: '!inputs.p11_contract_only && !inputs.p11_supported_template && !inputs.p11_bundled_template'
        continue-on-error: true
        run: |
          $failed = $false
          foreach ($test in @('accepts_zero_one_many_attachments_without_appending_them_again','preserves_multiline_leading_space_and_long_body_inside_the_existing_range')) {
            cargo test --manifest-path src-tauri/Cargo.toml $test --lib --locked --jobs 1 -- --nocapture 2>&1 | Tee-Object "$env:P11_ROOT/evidence/$test.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            if ((Get-Content "$env:P11_ROOT/evidence/$test.log" -Raw) -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { $failed = $true }
          }
          if ($failed) { throw 'Reported P11 tests failed; see exact assertion logs' }
      - name: Run all P11 Rust tests
        if: '!inputs.p11_contract_only && !inputs.p11_supported_template && !inputs.p11_bundled_template'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml official_document_odt --lib --locked --jobs 1 -- --nocapture --skip contract_probe --skip supported_template --skip bundled_template_tests 2>&1 | Tee-Object "$env:P11_ROOT/evidence/all-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'P11 Rust suite failed' }
          if ((Get-Content "$env:P11_ROOT/evidence/all-tests.log" -Raw) -notmatch 'test result: ok\. 24 passed; 0 failed; 0 ignored;') { throw 'Expected all 24 P11 tests without skips' }
      - name: Verify supported versions without private documents
        if: inputs.p11_supported_template
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml official_document_odt::tests::supported_template --lib --locked --jobs 1 -- --nocapture 2>&1 | Tee-Object "$env:P11_ROOT/evidence/supported-template.log"
          if ($LASTEXITCODE -ne 0) { throw 'Supported template tests failed' }
          if ((Get-Content "$env:P11_ROOT/evidence/supported-template.log" -Raw) -notmatch 'test result: ok\. 4 passed; 0 failed; 1 ignored;') { throw 'Expected four synthetic tests and one explicitly private-only harness' }
          $executables = @(Get-ChildItem "$env:CARGO_TARGET_DIR/debug/deps/school_health_desk_lib-*.exe")
          if ($executables.Count -ne 1) { throw 'Expected one library test executable' }
          Copy-Item $executables[0].FullName "$env:P11_ROOT/evidence/p11-offline-validator.exe"
          (Get-FileHash "$env:P11_ROOT/evidence/p11-offline-validator.exe" -Algorithm SHA256).Hash | Set-Content "$env:P11_ROOT/evidence/validator-sha256.txt"
      - name: Verify bundled home-v1 with existing product functions
        if: inputs.p11_bundled_template
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml official_document_odt::bundled_template_tests --lib --locked --jobs 1 -- --nocapture 2>&1 | Tee-Object "$env:P11_ROOT/evidence/bundled-template.log"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled template tests failed' }
          if ((Get-Content "$env:P11_ROOT/evidence/bundled-template.log" -Raw) -notmatch 'test result: ok\. 3 passed; 0 failed; 0 ignored;') { throw 'Expected three bundled template tests' }
      - name: Verify lockfile and source preservation
        if: always()
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source or lockfile changed' }
      - name: Preserve P11 synthetic test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p11-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P11_ROOT }}/evidence/*
          if-no-files-found: warn
          retention-days: 14
  native-build:
    if: github.ref == 'refs/heads/feature/official-document-enhancement' && (!inputs.runtime_only || inputs.p11_gui_only) && inputs.p11_source_sha == '' && !inputs.p11_authoring_only
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      QA_NATIVE_UI_ONLY: 'true'
      QA_P11_GUI_ONLY: ${{ inputs.p11_gui_only && 'true' || 'false' }}
      CI: 'true'
      CL: /utf-8
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize isolated paths and provenance
        run: |
          $root = Join-Path $env:RUNNER_TEMP "official-document-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path "$root/evidence" -Force | Out-Null
          "QA_ROOT=$root" >> $env:GITHUB_ENV
          "PSModuleAnalysisCachePath=$root/ModuleAnalysisCache" >> $env:GITHUB_ENV
          [ordered]@{ sourceSha=$env:GITHUB_SHA; ref=$env:GITHUB_REF; identifier='kr.sungandi.schoolhealthdesk.officialdocumentqa'; webview2UiQa='NOT RUN'; externalServices='NOT USED'; runId=$env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content "$root/evidence/provenance.json"
          Start-Transcript -Path "$root/evidence/environment.log"
          node --version
          git status --short
          Get-PSDrive C,D -ErrorAction SilentlyContinue | Select-Object Name,Used,Free
          Stop-Transcript
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Verify native prerequisites
        run: |
          Start-Transcript -Path "$env:QA_ROOT/evidence/toolchain.log"
          foreach ($tool in @('perl','nasm','cargo','rustc')) { Get-Command $tool -ErrorAction Stop | Select-Object Name,Source }
          perl -v
          cargo --version
          rustc -vV
          Stop-Transcript
      - name: Install locked frontend dependencies
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object "$env:QA_ROOT/evidence/npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: TypeScript
        if: '!inputs.p11_gui_only'
        run: |
          node node_modules/typescript/bin/tsc --noEmit 2>&1 | Tee-Object "$env:QA_ROOT/evidence/typescript.log"
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
      - name: Vitest regressions
        if: '!inputs.p11_gui_only'
        run: |
          npm test -- --maxWorkers=4 --exclude scripts/official-document-qa-paths.test.mjs --exclude scripts/qa/official-document-screen-assessment.test.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/vitest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Vitest failed' }
      - name: QA path contracts
        if: '!inputs.p11_gui_only'
        run: |
          node --test scripts/official-document-qa-paths.test.mjs scripts/qa/official-document-screen-assessment.test.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/path-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Path tests failed' }
      - name: Verify only new bundled-template UI routing
        if: inputs.p11_bundled_template
        run: |
          node node_modules/typescript/bin/tsc --noEmit 2>&1 | Tee-Object "$env:QA_ROOT/evidence/bundled-typescript.log"
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          npm test -- src/official-document/officialDocumentBundledTemplate.test.tsx --maxWorkers=2 2>&1 | Tee-Object "$env:QA_ROOT/evidence/bundled-ui.log"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled UI routing failed' }
      - name: Build and inspect synthetic-only QA frontend
        run: |
          # Tauri treats Windows drive-letter absolute frontendDist as a URL.
          # Use the existing relative-path QA contract to embed assets in the EXE.
          Remove-Item Env:BOGUNON_OFFICIAL_DOCUMENT_QA_OUTPUT_ROOT -ErrorAction SilentlyContinue
          node scripts/build-official-document-qa-frontend.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/frontend.log"
          if ($LASTEXITCODE -ne 0) { throw 'QA frontend failed' }
          Copy-Item "dist-official-document-qa/qa-build.json" "$env:QA_ROOT/evidence/qa-build.json"
      - name: Fetch locked Rust dependencies for subsequent offline build
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$env:QA_ROOT/evidence/cargo-fetch.log"
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo fetch failed' }
      - name: Build isolated QA executable without installer or app launch
        run: |
          node scripts/build-official-document-qa.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/native-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native QA build failed' }
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile changed' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target-official-document-qa/x86_64-pc-windows-msvc/release/bogunon-desk-official-document-qa.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'QA EXE missing' }
          Copy-Item -LiteralPath $exe -Destination "$env:QA_ROOT/evidence/"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  bogunon-desk-official-document-qa.exe" | Set-Content "$env:QA_ROOT/evidence/SHA256SUMS.txt"
          "Native build PASS. WebView2 actual UI QA NOT RUN. Source: $env:GITHUB_SHA. EXE SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Runner-only startup and actual isolation handshake
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $exe = Join-Path $env:QA_ROOT 'evidence/bogunon-desk-official-document-qa.exe'
          $webview = @(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $rules = @()
          $ready = $false
          $launched = $false
          try {
            if (-not $webview.Count) { throw 'WebView2 runtime unavailable' }
            # Block every non-loopback destination for this QA EXE and WebView2 only.
            $remote = @('0.0.0.0-126.255.255.255','128.0.0.0-255.255.255.255','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
            foreach ($program in @($exe) + $webview) {
              $name = 'official-qa-' + [guid]::NewGuid().ToString('N')
              $rules += $name
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Program $program -RemoteAddress $remote -Profile Any -ErrorAction Stop | Out-Null
            }
            $ready = $true
          } catch {
            @{ status='NOT RUN'; reason=$_.Exception.Message; uiQa='NOT RUN' } | ConvertTo-Json | Set-Content "$env:QA_ROOT/evidence/runtime-smoke.json"
          }
          try {
            if ($ready) {
              $launched = $true
              node scripts/qa/official-document-runtime-smoke.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/runtime-smoke.log"
              if ($LASTEXITCODE -ne 0) { throw 'Runner startup/isolation verification failed' }
            }
            Get-Content "$env:QA_ROOT/evidence/runtime-smoke.json" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $report = Get-Content "$env:QA_ROOT/evidence/runtime-smoke.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            if (-not $launched -or $report.cleanupConfirmed -eq $true) {
              foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue }
            } else {
              Write-Warning 'Process cleanup unconfirmed; outbound blocks retained until disposable runner shutdown'
            }
          }
      - name: Preserve executable and diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-document-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.QA_ROOT }}/evidence/*
          if-no-files-found: warn
          retention-days: 14

  runtime-ui:
    if: github.ref == 'refs/heads/feature/official-document-enhancement' && inputs.runtime_only && !inputs.p11_gui_only && inputs.p11_source_sha == '' && !inputs.p11_authoring_only
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      QA_NATIVE_UI_ONLY: 'true'
      QA_P11_GUI_ONLY: ${{ inputs.p11_gui_only && 'true' || 'false' }}
      QA_SKIP_FILE_PICKER: 'true'
      QA_EXPECTED_SOURCE_SHA: 5e3583f6b5d7abca2ccba58fc90e64a456bfb817
      QA_EXPECTED_EXE_SHA256: 14f761fcc5618f9d9cdb90c7be463f53a6fa468c0e53867a5d571f4f4f306f31
    steps:
      - name: Initialize runner-only runtime evidence path
        run: |
          "QA_ROOT=$env:RUNNER_TEMP/official-document-ui-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test independent native-screen verdicts
        run: node --test scripts/qa/official-document-screen-assessment.test.mjs
      - name: Download previously verified immutable QA binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-document-qa-5e3583f6b5d7abca2ccba58fc90e64a456bfb817-1
          run-id: '39809451795'
          github-token: ${{ github.token }}
          path: ${{ env.QA_ROOT }}/input
      - name: Verify reused binary without installing or rebuilding
        run: |
          New-Item -ItemType Directory "$env:QA_ROOT/evidence" -Force | Out-Null
          $source = Get-Content "$env:QA_ROOT/input/qa-build.json" -Raw | ConvertFrom-Json
          if ($source.sourceSha -ne $env:QA_EXPECTED_SOURCE_SHA) { throw 'Binary source SHA mismatch' }
          $exe = "$env:QA_ROOT/input/bogunon-desk-official-document-qa.exe"
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QA_EXPECTED_EXE_SHA256) { throw 'Binary SHA256 mismatch' }
          Copy-Item $exe,"$env:QA_ROOT/input/SHA256SUMS.txt","$env:QA_ROOT/input/qa-build.json" -Destination "$env:QA_ROOT/evidence/"
          Copy-Item "$env:QA_ROOT/input/provenance.json" "$env:QA_ROOT/evidence/binary-provenance.json"
          "PSModuleAnalysisCachePath=$env:QA_ROOT/ModuleAnalysisCache" >> $env:GITHUB_ENV
      - name: Runner-only startup and actual isolation handshake
        timeout-minutes: 6
        run: |
          $exe = Join-Path $env:QA_ROOT 'evidence/bogunon-desk-official-document-qa.exe'
          $webview = @(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $rules = @()
          $ready = $false
          $launched = $false
          try {
            if (-not $webview.Count) { throw 'WebView2 runtime unavailable' }
            # Block every non-loopback destination for this QA EXE and WebView2 only.
            $remote = @('0.0.0.0-126.255.255.255','128.0.0.0-255.255.255.255','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
            foreach ($program in @($exe) + $webview) {
              $name = 'official-qa-' + [guid]::NewGuid().ToString('N')
              $rules += $name
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Program $program -RemoteAddress $remote -Profile Any -ErrorAction Stop | Out-Null
            }
            $ready = $true
          } catch {
            @{ status='NOT RUN'; reason=$_.Exception.Message; uiQa='NOT RUN' } | ConvertTo-Json | Set-Content "$env:QA_ROOT/evidence/runtime-smoke.json"
          }
          try {
            if ($ready) {
              $launched = $true
              node scripts/qa/official-document-runtime-smoke.mjs 2>&1 | Tee-Object "$env:QA_ROOT/evidence/runtime-smoke.log"
              if ($LASTEXITCODE -ne 0) { throw 'Runner startup/isolation verification failed' }
            }
            Get-Content "$env:QA_ROOT/evidence/runtime-smoke.json" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $report = Get-Content "$env:QA_ROOT/evidence/runtime-smoke.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            if (-not $launched -or $report.cleanupConfirmed -eq $true) {
              foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue }
            } else {
              Write-Warning 'Process cleanup unconfirmed; outbound blocks retained until disposable runner shutdown'
            }
          }
      - name: Preserve actual native UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-document-native-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_ROOT }}/evidence/*
          if-no-files-found: warn
          retention-days: 14
