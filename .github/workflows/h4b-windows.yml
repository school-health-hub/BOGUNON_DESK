name: H4-B Windows checkout verification

on:
  push:
    branches: [codex/qa-h4b-windows-d344535e]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'school-health-hub/BOGUNON_DESK'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE_SHA: 5e69aeeb73a0a555743be65c25be2689b109b7ed
      BASE_SHA: ef0c3f4e7b87035f732b0ee238b41e74fe591c99
    steps:
      - name: Check out pinned product and baseline history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 5
          persist-credentials: false
      - name: Verify exact source, clean status and cumulative diff
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          git merge-base --is-ancestor $env:BASE_SHA HEAD
          if ($LASTEXITCODE) { throw 'Baseline missing or not an ancestor' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count) { throw 'Product checkout is dirty' }
          git diff --check $env:BASE_SHA HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "Source $env:SOURCE_SHA / base $env:BASE_SHA / clean / cumulative diff check PASS" >> $env:GITHUB_STEP_SUMMARY
