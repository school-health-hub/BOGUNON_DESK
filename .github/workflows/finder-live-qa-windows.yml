name: Finder isolated Windows Live QA build
on:
  workflow_dispatch:
  push:
    branches: [feature/education-video-finder]
    paths: [.github/workflows/finder-live-qa-windows.yml]
permissions:
  contents: read
concurrency:
  group: finder-live-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feature/education-video-finder'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FINDER_BASE_SHA: eed15c31a27e983a36fea2434fcf26dfbbebf4d1
      BOGUNON_QA_SOURCE_SHA: ${{ github.sha }}
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved base and scoped Finder QA changes
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:BOGUNON_QA_SOURCE_SHA) { throw 'Source mismatch' }
          git merge-base --is-ancestor $env:FINDER_BASE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved Finder checkpoint missing' }
          $allowed = '^(\.gitignore|\.github/workflows/finder-live-qa-windows\.yml|scripts/(build-finder-live-qa-frontend|package-finder-live-qa)\.mjs|docs/education-video/finder-live-qa-windows\.md|vite\.finder-live-qa\.config\.ts|src/finder-live-qa/(main\.tsx|services\.ts|services\.test\.ts)|src-tauri/(build\.rs|tauri\.finder-live-qa\.conf\.json|src/finder_live_qa\.rs|src/chatgpt/plan/live_qa(_policy)?\.rs))$'
          foreach ($file in (git diff --name-only $env:FINDER_BASE_SHA HEAD)) {
            if ($file -notmatch $allowed) { throw "Non-QA source change: $file" }
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
          key: finder-live-qa
      - name: Select existing Windows Perl without changing host settings
        shell: pwsh
        run: |
          if (Test-Path 'C:\Strawberry\perl\bin\perl.exe') { 'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH; $env:PATH = "C:\Strawberry\perl\bin;$env:PATH" }
          perl -MLocale::Maketext::Simple -e 'print "Perl dependency ready\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Missing runner Perl module' }
      - run: npm ci
      - name: Verify bundled search initialization
        run: node node_modules/vitest/vitest.mjs run src/chatgpt src/finder-live-qa/services.test.ts src/education-video/AiVideoFinder.test.tsx src/education-video/AiVideoFinder.autoSearch.test.tsx
      - name: Build isolated portable executable only
        shell: pwsh
        run: |
          node node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-msvc --features finder-live-qa --config src-tauri/tauri.finder-live-qa.conf.json --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Finder QA build failed' }
      - name: Bind executable to source and hash
        shell: pwsh
        run: |
          node scripts/package-finder-live-qa.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FINDER-LIVE-QA5-${{ github.sha }}
          path: artifacts/finder-live-qa5/*
          if-no-files-found: error
          retention-days: 7
