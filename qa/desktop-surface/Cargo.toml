[package]
name = "desktop-surface-read-only-qa"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "verification.rs"

[[bin]]
name = "desktop-surface-live"
path = "live_main.rs"
required-features = ["live-windows-skip-miri"]
test = false
bench = false

[[bin]]
name = "desktop-surface-synthetic"
path = "synthetic_main.rs"
required-features = ["synthetic-subprocess"]
test = false
bench = false

[[bin]]
name = "desktop-surface-own-window"
path = "own_main.rs"
required-features = ["own-window-qa-skip-miri"]
test = false
bench = false

[[bin]]
name = "desktop-surface-own-synthetic"
path = "own_synthetic_main.rs"
required-features = ["own-synthetic"]
test = false
bench = false

[[test]]
name = "own_protocol_subprocess"
path = "own_protocol_subprocess.rs"
required-features = ["own-synthetic"]

[[test]]
name = "protocol_subprocess"
path = "protocol_subprocess.rs"
required-features = ["synthetic-subprocess"]

[features]
default = []
live-windows-skip-miri = []
synthetic-subprocess = []
own-window-qa-skip-miri = []
own-synthetic = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation", "Win32_Globalization",
  "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_StationsAndDesktops",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
