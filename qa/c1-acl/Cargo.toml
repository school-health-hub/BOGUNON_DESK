[package]
name = "bogunon-c1-acl-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace]
