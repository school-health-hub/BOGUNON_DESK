  <style>text{font-family:Pretendard,"Segoe UI",sans-serif;fill:#243246}.t{font-weight:700}.s{font-size:13px;fill:#626874}.frame{fill:#f5f0f3;stroke:#d7c6cf}.paper{fill:#fff;stroke:#dce6e4}.step{fill:#fff9fb;stroke:#d7c6cf}.on{fill:#147d70;stroke:#147d70}.soft{fill:#eaf6f2;stroke:#147d70}</style>
