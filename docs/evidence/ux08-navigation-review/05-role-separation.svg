<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>text{font-family:Pretendard,"Segoe UI",sans-serif;fill:#243246}.t{font-weight:700}.s{font-size:14px;fill:#626874}.card{fill:#fff9fb;stroke:#d7c6cf}.dock{fill:#f4e6ec;stroke:#87465f}.pal{fill:#e9f2f3;stroke:#557b91}.work{fill:#eaf6f2;stroke:#147d70}.set{fill:#f1eaf5;stroke:#77648d}</style>
  <rect width="1440" height="900" fill="#f3edf1"/><text x="40" y="52" font-size="24" class="t">Dock · Palette · Workspace · Settings 역할 분리</text><text x="40" y="82" class="s">개념도(material fidelity 아님) · 실행·확인·편집·설정을 분리</text>
  <rect x="70" y="150" width="290" height="260" rx="24" class="dock"/><text x="104" y="200" font-size="22" class="t">Dock</text><text x="104" y="238" class="s">빠른 실행 / 현재 작업 복귀</text><text x="104" y="278" class="s">• 아이콘 중심</text><text x="104" y="310" class="s">• 순서·표시 설정 보존</text><text x="104" y="342" class="s">• 기능 설명/단계 메뉴 금지</text>
  <rect x="405" y="150" width="290" height="260" rx="24" class="pal"/><text x="439" y="200" font-size="22" class="t">Desktop Palette</text><text x="439" y="238" class="s">작은 정보 확인 / 빠른 입력</text><text x="439" y="278" class="s">• 독립 위치·크기</text><text x="439" y="310" class="s">• 모니터별 프로필</text><text x="439" y="342" class="s">• Main-only IPC 노출 금지</text>
  <rect x="740" y="150" width="290" height="260" rx="24" class="work"/><text x="774" y="200" font-size="22" class="t">Workspace</text><text x="774" y="238" class="s">본격 편집 / 검토 / 출력</text><text x="774" y="278" class="s">• 콘텐츠 폭 우선</text><text x="774" y="310" class="s">• 단계/문맥 도구만 표시</text><text x="774" y="342" class="s">• 세션·revision owner 유지</text>
  <rect x="1075" y="150" width="290" height="260" rx="24" class="set"/><text x="1109" y="200" font-size="22" class="t">독립 Settings</text><text x="1109" y="238" class="s">계정 / 기기 / 화면 / 연결</text><text x="1109" y="278" class="s">• 업무 편집과 분리</text><text x="1109" y="310" class="s">• 좌측 nav 허용</text><text x="1109" y="342" class="s">• 단일 창·권한 경계 유지</text>
  <path d="M215 450v80h335v-80M550 530h335v-80M885 530h335v-80" fill="none" stroke="#9d8792" stroke-width="3"/>
  <rect x="270" y="560" width="900" height="235" rx="26" class="card"/><text x="310" y="610" font-size="20" class="t">사용 흐름</text>
  <text x="310" y="660" class="s">1. Dock에서 ‘보건소식지’ 실행 → Workspace가 기존 session owner로 열림</text>
  <text x="310" y="700" class="s">2. Workspace 상단 단계 도구에서 월·AI·원고·디자인·출력 이동 → 작업은 unmount하지 않음</text>
  <text x="310" y="740" class="s">3. Palette는 오늘 할 일·메모 등 작은 정보만 표시 → 소식지 원고·파일·AI 전송 데이터는 투영하지 않음</text>
  <text x="310" y="780" class="s">4. Settings는 AI 연결과 화면/모니터 설정을 소유 → NS-05 계약 변경 없음</text>
</svg>
