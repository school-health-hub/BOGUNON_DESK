[package]
name = "my-finance-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
rand = "=0.9.5"
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
zeroize = "=1.9.0"
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-dpapi = "=0.2.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
