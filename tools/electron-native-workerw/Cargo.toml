[package]
name = "bogunon-workerw-boundary"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
windows-adapter-skip-miri = ["dep:windows"]
windows-observation-skip-miri = ["dep:windows"]

[[bin]]
name = "native05a-readonly"
path = "src/bin/native05a-readonly.rs"
required-features = ["windows-observation-skip-miri"]

[dependencies]
thiserror = "2"
serde = {version="1",features=["derive"]}
serde_json = "1"
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
