[package]
name = "official-document-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "official_document_cli"
path = "src/lib.rs"

[[bin]]
name = "official-document-cli"
path = "src/main.rs"

[dependencies]
pdf-extract = "=0.12.1"
quick-xml = "=0.42.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

